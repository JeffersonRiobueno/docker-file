name: Build php-apache 8.4

on:
  push:
    branches: [master]
    paths:
      - "8-apache/**"
      - ".github/workflows/php-apache-8.4.yml"
  # Rebuild semanal para recoger parches de seguridad de la imagen base
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  IMAGE: riobueno/php-apache
  TAG: "8.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: riobueno
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: 8-apache
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
